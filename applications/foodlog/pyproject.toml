[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foodlog"
version = "0.1.0"
description = "Low-effort background calorie + macro logger from food photos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hsv01" }]
dependencies = []  # core is stdlib only; estimators call HTTP/CLI directly

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
foodlog = "foodlog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
